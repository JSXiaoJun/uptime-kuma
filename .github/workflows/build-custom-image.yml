name: Build and Publish Docker Image

# Builds the frontend, bakes it into a Docker image and publishes it to the
# GitHub Container Registry on every push to master (and on demand).
#
# The image is published to:
#   ghcr.io/<owner>/<repo>:latest
#   ghcr.io/<owner>/<repo>:<short-sha>
#
# Pull it on the server with:
#   docker pull ghcr.io/<owner>/<repo>:latest
#
# Only paths that end up inside the image trigger a build. Docs-only or
# CI-only pushes (AGENTS.md, .github/, tmp/, ...) skip this workflow; use
# "Run workflow" when an image is needed anyway.

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - "server/**"
      - "src/**"
      - "db/**"
      - "docker/**"
      - "extra/**"
      - "public/**"
      - "config/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - "tsconfig.json"
      - "tsconfig-backend.json"
      - "ecosystem.config.js"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The upstream dockerfile expects a pre-built `dist/` directory: the
      # image build itself only runs `npm ci --omit=dev`. Building the
      # frontend here is what makes the custom UI show up in the image.
      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Build frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f server/model/line_status.js || { echo "::error::line status module missing"; exit 1; }
          echo "dist/ contains $(find dist -type f | wc -l) files"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dockerfile
          target: release
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The `build` stage copies the whole context with `COPY . .`. Docker
          # hashes that directory to decide whether to reuse the cached layer,
          # and with cross-run GHA cache it has been observed to reuse a stale
          # layer even though dist/ changed, producing an image identical to
          # the previous build. Passing the commit SHA as a build arg makes the
          # layer cache commit-specific, so every commit gets a fresh layer.
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Verify the deployed image actually contains this commit:"
            echo ""
            echo '```bash'
            echo "docker run --rm --entrypoint sh ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest -c 'cat /app/data/.build-commit'"
            echo '```'
            echo ""
            echo "Pull it with:"
            echo ""
            echo '```bash'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
